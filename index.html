<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Private Media Session</title>

<!-- ======================================== -->
<!-- EDIT OG / PREVIEW DISINI -->
<!-- ======================================== -->
<!--
ganti sesuai project:

og:title       = judul preview
og:description = deskripsi preview
og:image       = gambar preview
og:url         = domain project

-->

<meta property="og:title" content="✨ Live Session, Gallery Update"/>
<meta property="og:description" content="A Small Collections Preview"/>
<meta property="og:image" content="https://i.imgur.com/IS0bwwz.jpeg"/>
<meta property="og:type" content="website"/>

<!-- GANTI DOMAIN PROJECT -->
<meta property="og:url" content="https://room1.lovegallery.online"/>

<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#0f0f0f"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.container{
width:100%;
max-width:340px;
text-align:center;
padding:20px;
}

.loader{
width:58px;
height:58px;
border:4px solid rgba(255,255,255,0.08);
border-top:4px solid #00ffcc;
border-radius:50%;
animation:spin .9s linear infinite;
margin:0 auto 22px;
}

@keyframes spin{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

h2{
font-size:22px;
margin-bottom:14px;
font-weight:600;
}

p{
font-size:13px;
opacity:.65;
margin-top:10px;
}

.progress-wrapper{
width:100%;
height:9px;
background:#1d1d1d;
border-radius:999px;
overflow:hidden;
margin-top:15px;
}

.progress{
width:0%;
height:100%;
border-radius:999px;
background:linear-gradient(90deg,#00ffcc,#00c3ff);
transition:width .18s linear;
}

.percent{
margin-top:10px;
font-size:14px;
opacity:.8;
}

</style>
</head>

<body>

<div class="container">

<div class="loader"></div>

<h2 id="status">Preparing your content...</h2>

<div class="progress-wrapper">
<div class="progress" id="progress"></div>
</div>

<div class="percent" id="percent">0%</div>

<p>Please wait a moment</p>

</div>

<script>

// ========================================
// TRACK LIST
// ========================================
//
// tambah nama track baru disini
//
// kiri  = nama track
// kanan = hash/random
//
// ========================================

const TRACKS = {

ZEUS:
"a81c92bc77df991ab2",

MCKMA:
"b72aa9d2ff771cc81",

MCKMA99:
"c91ab72dd8821fa09",

MANCINGYUH:
"d88ac21ff771bc91",

INSOMNIA:
"e72bc91aa882dd11",

ATHENA:
"f91aa2bc7711de09"

};

// ========================================
// PILIH TRACK PROJECT DISINI
// ========================================
//
// ganti sesuai project
//
// contoh:
// "ZEUS"
// "INSOMNIA"
//
// ========================================

const TRACK_NAME =
"ZEUS";

// ========================================
// EDIT LINK LANDING DISINI
// ========================================
//
// cukup link dasar
// jangan tambah ?track=
//
// ========================================

const FINAL_LINK =
"https://dfbjbie.pixelsau.com/s/3cd7b37fd681f";

// ========================================
// AUTO SYSTEM
// ========================================

// otomatis ambil hash track
const TRACK_HASH =
TRACKS[TRACK_NAME];

// build final url
const REDIRECT_URL =
FINAL_LINK +
"?track=" +
encodeURIComponent(TRACK_HASH);

// ========================================
// LOADING CONFIG
// ========================================

const TOTAL_DURATION = 2800;

// ========================================
// ELEMENT
// ========================================

const progressBar =
document.getElementById("progress");

const percentText =
document.getElementById("percent");

const statusText =
document.getElementById("status");

// ========================================
// LOADING SYSTEM
// ========================================

let progress = 0;

const interval = setInterval(() => {

progress += 5;

if(progress > 100){
progress = 100;
}

progressBar.style.width =
progress + "%";

percentText.innerText =
Math.floor(progress) + "%";

// dynamic status

if(progress < 30){

statusText.innerText =
"Preparing your content...";

}
else if(progress < 60){

statusText.innerText =
"Connecting securely...";

}
else if(progress < 90){

statusText.innerText =
"Loading media assets...";

}
else{

statusText.innerText =
"Launching...";

}

// redirect

if(progress >= 100){

clearInterval(interval);

setTimeout(() => {

window.location.href =
REDIRECT_URL;

}, 250);

}

}, TOTAL_DURATION / 20);

</script>

</body>
</html>
